
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "bellanov-gcp-cli"
version = "0.1.0"
authors = [
  { name="Bellanov Apilli", email="bellanovapilli@gmail.com" },
]
description = "Tools to bootstrap development on Google Cloud Platform (GCP)."
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "httpx",
    "tenacity",
]

[project.optional-dependencies]
dev = [
    "black",
    "coverage",
    "flake8",
    "google-api-python-client",
    "google-cloud-resource-manager",
    "ipython",
    "isort",
    "mypy",
    "pydantic",
    "pytest", 
]

[tool.hatch.build.targets.wheel]
packages = ["cli/"]

[project.urls]
Homepage = "https://github.com/bellanov/gcp"
Issues = "https://github.com/bellanov/gcp/issues"

[tool.coverage.run]
omit = [
    "tests/*",
    "*/test_*.py",
]

[tool.isort]
profile = "black"
