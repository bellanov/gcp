# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Unit Tests - development

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    environment: development
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.14"]

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      GCP_PROJECT_NAME: ${{ vars.GCP_PROJECT_NAME }}
      GCP_FOLDER_NAME: ${{ vars.GCP_FOLDER_NAME }}
      GCP_FOLDER_ID: ${{ vars.GCP_FOLDER_ID }}
      GCP_ORGANIZATION_ID: ${{ vars.GCP_ORGANIZATION_ID }}
      GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Lint with flake8, black, isort
      run: |
        scripts/ci/lint.sh

    - name: Test with pytest
      run: |
        scripts/ci/test.sh
